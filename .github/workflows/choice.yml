name: Manual Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the target environment'
        required: true
        type: choice
        default: 'staging'
        options:
          - development
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Run deployment script
        run: |
          echo "Deploying to: ${{ github.event.inputs.environment }}"
